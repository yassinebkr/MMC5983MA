sentence=Driver for the MEMSIC MMC5983MA 3-axis magnetometer with 18-bit resolution.
paragraph=Supports I2C and SPI on Arduino-compatible boards. Returns microtesla directly, offers offset-canceled reads using the SET/RESET coils, exposes the on-die self-test, and handles two hardware quirks (SET pulse before single-shot reads, first-sample wait when entering continuous mode) that the SparkFun reference library leaves to the caller. Hardware-validated on Adafruit Feather RP2040 RFM95.
