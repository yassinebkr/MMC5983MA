[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmc5983ma"
version = "0.1.0"
description = "CircuitPython driver for the MEMSIC MMC5983MA 3-axis magnetometer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.7"
authors = [{ name = "Yassine Ben Khira" }]
keywords = ["circuitpython", "magnetometer", "mmc5983ma", "memsic", "i2c", "spi", "aerospace"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
dependencies = [
    "Adafruit-Blinka",
    "adafruit-circuitpython-busdevice",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/yassinebkr/MMC5983MA"
Repository = "https://github.com/yassinebkr/MMC5983MA"
Issues = "https://github.com/yassinebkr/MMC5983MA/issues"

[tool.setuptools.packages.find]
where = ["circuitpython"]

[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
